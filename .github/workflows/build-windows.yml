name: Build Windows VST3

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Configure (Visual Studio 2022, x64)
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build VST3 (Release)
        run: cmake --build build --config Release --target PotatoKicker_VST3 --parallel

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: Potato-Kicker-VST3-Windows-x64
          path: build/PotatoKicker_artefacts/Release/VST3/
          if-no-files-found: error

      - name: Validate with pluginval
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip" -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          $exe = Get-ChildItem -Path pluginval -Recurse -Filter pluginval.exe | Select-Object -First 1
          & $exe.FullName --strictness-level 5 --validate-in-process --timeout-ms 120000 --validate "build/PotatoKicker_artefacts/Release/VST3/Potato-Kicker.vst3"
          if ($LASTEXITCODE -ne 0) { throw "pluginval reported problems" }
